# GitHub Actions build matrix (also consumed by build.sh for local builds).
#
# Dongle mode (daily driver): flash all three of the first group.
# Standalone mode (fallback, no dongle): flash left_central + right.
# Before switching modes, flash settings_reset to every part first.
---
include:
  # --- Dongle mode -----------------------------------------------------------
  - board: nice_nano_v2
    shield: eyelash_sofle_dongle dongle_display
    snippet: studio-rpc-usb-uart
    artifact-name: eyelash_sofle_dongle
  - board: nice_nano_v2
    shield: eyelash_sofle_left nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: eyelash_sofle_left_peripheral
  - board: nice_nano_v2
    shield: eyelash_sofle_right nice_view
    artifact-name: eyelash_sofle_right

  # Dongle with the OLED driven as SSD1306, in case the SH1106 build shows a
  # shifted or garbled image.
  - board: nice_nano_v2
    shield: eyelash_sofle_dongle_ssd1306 dongle_display
    snippet: studio-rpc-usb-uart
    artifact-name: eyelash_sofle_dongle_ssd1306

  # --- Standalone mode (left half is the central) -----------------------------
  - board: nice_nano_v2
    shield: eyelash_sofle_left nice_view
    artifact-name: eyelash_sofle_left_central

  # --- Pairing reset, flash to all parts before changing modes ----------------
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
