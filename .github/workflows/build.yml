name: Build ZMK firmware
on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - "keymap-drawer/**"
      - "README.md"
      - ".agents/**"

jobs:
  build:
    # The workflow revision is independent of the ZMK revision in config/west.yml.
    # main is used because the v0.3.x workflow still runs actions/checkout@v4
    # (Node 20, deprecated on GitHub runners).
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
