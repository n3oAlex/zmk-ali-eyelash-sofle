# Dongle only.

# The dongle has no keys to wake it, so it must never deep-sleep. Use its
# power switch instead.
CONFIG_ZMK_SLEEP=n

# Show both halves' battery levels on the OLED.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Do not advertise the dongle's own battery to the host.
CONFIG_BT_BAS=n

# RGB underglow behavior, so the RGB keys reach the halves and ZMK Studio can
# assign them. The dongle's own "strip" is a dummy (see the overlay); it must
# not control external power, which feeds the OLED.
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Dongle display module options
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
# Third battery gauge for the dongle's own cell.
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# ZMK Studio over USB, unlocked by default. The USB transport comes from the
# studio-rpc-usb-uart snippet in build.yaml.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
