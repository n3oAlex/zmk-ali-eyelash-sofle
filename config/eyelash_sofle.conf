# Settings valid for every part (left, right, dongle). ZMK merges this with the
# part-specific file (eyelash_sofle_left.conf, _right.conf, _dongle.conf); the
# files are kept disjoint so merge order never matters.

# Radio
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# External power output (feeds the displays and LEDs)
CONFIG_ZMK_EXT_POWER=y

# Displays on all three parts
CONFIG_ZMK_DISPLAY=y

# Mouse keys / scrolling behaviors used by the keymap
CONFIG_ZMK_POINTING=y

CONFIG_USB_DEVICE_MANUFACTURER="sofle"
